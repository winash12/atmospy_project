name: Pramana Vayu High-Performance Engine CI Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository State
      uses: actions/checkout@v4

    - name: Set Up Python Application Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Packaging Tools and OpenMP Core Compiler Runtime
      run: |
        sudo apt-get update
        sudo apt-get install -y libomp-dev ninja-build gfortran libspatialindex-dev libgeos-dev

    - name: Install Statically Chained Header-Only xtensor Ecosystem (xtl, xtensor, xtensor-python)
      run: |
        # 1. Install xtl (Core foundation block)        
        git clone --depth 1 https://github.com/xtensor-stack/xtl.git
        sudo cp -r xtl/include/xtl /usr/local/include/

        # 2. Install base xtensor core engine
        git clone --depth 1 https://github.com/xtensor-stack/xtensor.git
        sudo cp -r xtensor/include/xtensor /usr/local/include/
        
        # 3. Install xtensor-python binding layers
        git clone --depth 1 https://github.com/xtensor-stack/xtensor-python.git
        sudo cp -r xtensor-python/include/xtensor-python /usr/local/include/

    - name: Install High-Performance Scientific Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy xarray scipy matplotlib cartopy dask distributed meson ninja pybind11 pytest

    - name: Configure and Compile Fused Multi-Threaded C++ Binary Extensions Via Meson
      run: |
        meson setup build
        meson compile -C build
        meson install -C build

    - name: Run Modular Tests Verification Suites Framework
      run: |
        pytest tests/ --ignore=.venv/ --suppress-no-test-exit-code
