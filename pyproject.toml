[build-system]
requires = ["meson-python", "ninja", "numpy", "xtensor"]
build-backend = "mesonpy"

[project]
name = "vayu"
version = "1.0.0"
description = "Hybrid High-Performance Atmospheric Isentropic Potential Vorticity Transforms Engine"
authors = [{name = "Aswin"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "xarray",
    "scipy",
    "matplotlib",
    "cartopy",
    "dask",
    "distributed"
]
